server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: cart-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cart_db}
    username: ${DB_USERNAME:cart_user}
    password: ${DB_PASSWORD:cart_pass}
  jpa:
    open-in-view: false            # không giữ session JPA đến tầng web
    show-sql: false
    hibernate:
      # Dev: tự tạo/cập nhật bảng. Production: đặt "validate" và quản lý schema bằng Flyway/Liquibase
      # (DDL tham chiếu nằm ở src/main/resources/db/schema.sql).
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

# Công tắc chọn implementation (dùng cho lúc nâng cấp lên hệ thống microservices đầy đủ)
cart:
  storage:
    type: jpa            # jpa | redis (khi có RedisCartStorageAdapter)
  product-client:
    mode: mock           # mock | rest/feign (khi có client thật gọi product-service)

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
